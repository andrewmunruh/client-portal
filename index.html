<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Back-office bot portal — prototype</title>
<link rel="stylesheet" href="styles.css"></head>
<body>
<div class="proto"><span class="full">Clickable prototype · no backend · all numbers and records are <b>example data</b> · changes reset on reload</span><span class="short">Prototype · <b>example data</b> · resets on reload</span></div>
<header class="top">
  <div class="brand"><span class="dot"></span><div><b>Back-office bots</b><small>run by Andy Unruh</small></div></div>
  <button class="b" id="menuBtn" aria-expanded="false" aria-controls="ctrls">Prototype ▾</button>
  <button class="exitlink hidden" id="exitDemo">Exit demo</button>
  <div class="ctrls" id="ctrls">
    <label>Tenant <select id="tenantSel"></select></label>
    <div class="seg" id="roleSeg"><button data-role="client">Client view</button><button data-role="admin">Andy admin</button></div>
    <button class="b" id="demoBtn">Demo mode</button>
  </div>
</header>
<div class="shell">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="modal" class="modal hidden"><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="extras.js"></script>
<script src="admin.js"></script>
<script>render()</script>
</body></html>
